[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin_worker"
version = "0.1.0"
description = "Out-of-process PyTwin runner streaming ROM results to Omniverse Kit"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pytwin[graphics]",  # TBROM point files are read through pyvista
    "numpy",
]

[project.optional-dependencies]
mesh = ["scipy", "ansys-mapdl-reader"]  # .rst/.cdb readers without an Ansys install

[tool.setuptools]
packages = ["twin_worker"]
