[package]
title = "TwinViz Viewer"
version = "0.1.0"  # Semantic Versioning is used: https://semver.org/
description = "Runs a PyTwin ROM in a separate process and visualizes its results."
category = "Simulation"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["pytwin", "rom", "tbrom", "simulation", "visualization"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI


[dependencies]
"omni.kit.uiapp" = {}


[settings]
# Empty = <repo>/twin_worker and its .venv python.
exts."twinviz.viewer".worker_root = ""
exts."twinviz.viewer".worker_python = ""


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import twinviz.viewer"
name = "twinviz.viewer"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
    "omni.kit.test",
    "omni.kit.ui_test"  # UI testing extension
]

args = [
]
