[package]
# Kit Extension Manager에 표시할 메타데이터. 동작/개발 흐름은 docs/README.md 참고.
title = "TwinViz Viewer"
version = "0.1.0"  # Semantic Versioning is used: https://semver.org/
description = "Runs a PyTwin ROM in a separate process and visualizes its results."
category = "Simulation"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["pytwin", "rom", "tbrom", "simulation", "visualization"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI


[dependencies]
# Kit이 확장 시작 전에 활성화할 기능: UI, USD, Fabric, 뷰포트, 파일 선택창.
"omni.kit.uiapp" = {}
"omni.kit.pip_archive" = {}  # numpy
"omni.usd" = {}
"usdrt.scenegraph" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.window.filepicker" = {}


[settings]
# extension.py에서 /exts/twinviz.viewer 경로로 읽어 TwinSession 생성에 전달한다.
# Empty = <repo>/twin_worker and its .venv python.
exts."twinviz.viewer".worker_root = ""
exts."twinviz.viewer".worker_python = ""
# Empty = <repo>/models
exts."twinviz.viewer".models_dir = ""
# Length unit of TBROM point coordinates (Ansys results are SI).
exts."twinviz.viewer".model_units_in_meters = 1.0
# Per-frame writes: "fabric" (USDRT, fast; USD layer keeps the initial values) or "usd".
exts."twinviz.viewer".write_backend = "fabric"
# true = let omni.kit.debug.python attach its debugger to the worker (much slower; for debugging only).
exts."twinviz.viewer".debug_worker = false
# Per-TBROM point budget. Larger fields are randomly sampled by the worker (computed, sent and drawn
# only for these points). 0 = no limit.
exts."twinviz.viewer".max_display_points = 1000000


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import twinviz.viewer"
# __init__.py → extension.py → TwinSession + TwinVizWindow 순서로 초기화된다.
name = "twinviz.viewer"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
# tests/__init__.py가 테스트 모듈을 노출한다. 일부 테스트는 워커 venv와 실모델이 필요하다.
dependencies = [
    "omni.kit.test",
    "omni.kit.ui_test"  # UI testing extension
]

args = [
]
